[project]
name = "knowledgeops-backend"
version = "0.1.0"
description = "Backend KnowledgeOps Assistant: API FastAPI z kontrolą stanu bazy."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: testy wymagające działającej bazy (DATABASE_URL)",
    "corpus: testy wymagające pobranych danych TechQA (TECHQA_DIR)",
]
